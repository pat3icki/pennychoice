version: "2"
sql:
  - schema: "../internal/db/raw_schema"
    queries: "../internal/db/queries"
    engine: "postgresql"
    gen:
      go:
        # Matches your folder structure
        package: "sqlc"
        out: "../internal/db/sqlc"

        # Specifies pgx/v5 driver
        sql_package: "pgx/v5"

        # helpful generation settings
        emit_json_tags: true
        emit_db_tags: true
        emit_interface: true      # Generates a Querier interface (great for mocking/testing)
        emit_empty_slices: true   # Returns []T{} instead of nil for empty results
        # emit_result_struct_pointers: true

        # Type Overrides 
        overrides:
          # Maps SQL UUID to google/uuid (standard Go practice)
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"

          # Maps numeric/decimal to pgtype (preserves precision for finance)
          - db_type: "numeric"
            go_type: "github.com/jackc/pgx/v5/pgtype.Numeric"

          # Maps jsonb to generic JSON type
          - db_type: "jsonb"
            go_type: "github.com/jackc/pgx/v5/pgtype.JSONBCodec"

          - db_type: "identity_verification_status"
            go_type: "string"